name: CI and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Release metadata
    outputs:
      client_version: ${{ steps.versions.outputs.client_version }}
      server_version: ${{ steps.versions.outputs.server_version }}
      client_release: ${{ steps.versions.outputs.client_release }}
      server_release: ${{ steps.versions.outputs.server_release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate version and changelog
        id: versions
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python tools/check_release.py
      - name: Release automation tests
        run: python -m unittest discover -s tools/tests

  server:
    name: Service tests
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r reservation-service/requirements.txt
      - run: python reservation-service/package_source.py --output reservation-service/source.zip
      - run: python -m unittest discover -s reservation-service/tests
      - run: python -m unittest discover -s windows-app/tests -p test_release_packaging.py
      - name: Package server release
        if: needs.metadata.outputs.server_release == 'true'
        run: python package-release.py server
      - name: Verify server package
        if: needs.metadata.outputs.server_release == 'true'
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.server_version }}
        run: python tools/verify_artifacts.py server "artifacts/server/$PACKAGE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.metadata.outputs.server_release == 'true'
        with:
          name: release-server
          path: artifacts/server/${{ needs.metadata.outputs.server_version }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows:
    name: Windows build and tests
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build Windows client
        run: ./windows-app/build.ps1
      - name: Client self-tests (including simulated printer and layouts)
        run: |
          ./windows-app/dist/asn-labeler-test.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Client self-tests failed' }
      - name: Fetch verified third-party source
        if: needs.metadata.outputs.client_release == 'true'
        run: ./windows-app/tools/fetch-zxing-source.ps1
      - name: Package release and source
        if: needs.metadata.outputs.client_release == 'true'
        run: python package-release.py client
      - name: Verify archive contents and manifest
        if: needs.metadata.outputs.client_release == 'true'
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.client_version }}
        run: python tools/verify_artifacts.py client "artifacts/client/$env:PACKAGE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.metadata.outputs.client_release == 'true'
        with:
          name: release-client
          path: artifacts/client/${{ needs.metadata.outputs.client_version }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: docker build --tag asn-reservation:ci reservation-service
      - run: python tools/docker_smoke.py

  gate:
    name: CI gate
    if: always()
    needs: [metadata, server, windows, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json,os,sys; results=json.loads(os.environ["RESULTS"]); print({k:v["result"] for k,v in results.items()}); sys.exit(0 if all(v["result"] == "success" for v in results.values()) else 1)'

  release:
    name: Publish release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [gate, metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.metadata.outputs.client_release == 'true'
        with:
          name: release-client
          path: artifacts/client/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.metadata.outputs.server_release == 'true'
        with:
          name: release-server
          path: artifacts/server/
      - name: Publish client (existing published releases remain untouched)
        if: needs.metadata.outputs.client_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/publish_release.py client artifacts/client
      - name: Publish server (existing published releases remain untouched)
        if: needs.metadata.outputs.server_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/publish_release.py server artifacts/server
