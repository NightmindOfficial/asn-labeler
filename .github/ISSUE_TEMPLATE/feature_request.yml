name: Feature request
description: Suggest a focused improvement
labels: [enhancement]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Client, Server, Both]
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Problem and proposed improvement
      description: What workflow should improve? Maintainers assign component and target-release labels during triage.
    validations:
      required: true
