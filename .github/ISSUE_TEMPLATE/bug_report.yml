name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Client, Server, Both]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Client and server versions
      placeholder: "Client 2.1.0, Server 2.1.0"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected behavior and actual result
      description: Include OS, printer/media or deployment details when relevant. Remove keys and personal data from diagnostics/screenshots.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, private documents and personal information.
          required: true
